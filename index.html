<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI मीडिया स्टूडियो</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#14213d; --muted:#5b6679;
  --line:#c9d1e0; --accent:#2f5bea; --accent-ink:#ffffff; --err:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1320; --surface:#161d30; --ink:#e8ecf5; --muted:#9aa5bd;
    --line:#2f3a5a; --accent:#7c9bff; --accent-ink:#0e1320; --err:#ff8a80;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hind","Noto Sans Devanagari",system-ui,sans-serif;
  font-size:17px; line-height:1.6;
  padding:max(20px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));
}
main{max-width:600px;margin:0 auto}
h1{font-size:30px;line-height:1.25;margin:8px 0 14px;font-weight:700}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 20px;padding-bottom:4px}
.tabs button{
  flex:0 0 auto;font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:0 14px;
  border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;
}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel p.lead{color:var(--muted);margin:0 0 16px}
textarea,input[type=password]{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:2px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 14px;
}
textarea{min-height:110px;resize:vertical}

.pick{
  display:grid;place-items:center;position:relative;overflow:hidden;min-height:140px;margin:0 0 14px;
  border:2px dashed var(--line);border-radius:6px;background:var(--surface);color:var(--muted);
  text-align:center;padding:12px;cursor:pointer;
}
.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pick img{max-width:100%;max-height:50vh;border-radius:4px;display:block}

button.go{
  width:100%;min-height:52px;font:inherit;font-weight:700;font-size:18px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;cursor:pointer;
}
button.go:disabled{opacity:.45;cursor:not-allowed}
button.alt{
  min-height:44px;margin-top:12px;padding:0 14px;font:inherit;font-weight:600;
  background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:6px;cursor:pointer;
}

.status{min-height:1.6em;margin:14px 0 0;color:var(--muted)}
.status.err{color:var(--err)}
.out{margin-top:16px}
.out img,.out video{width:100%;border-radius:6px;background:#000;display:block}
.out a{display:inline-block;margin-top:10px;color:var(--accent);font-weight:600}
#pwBox{margin-bottom:16px}
</style>
</head>
<body>
<main>
  <h1>AI मीडिया स्टूडियो</h1>

  <div id="pwBox" hidden>
    <label for="pw">पासवर्ड</label>
    <input type="password" id="pw" autocomplete="current-password">
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="a" aria-selected="true">टेक्स्ट से इमेज</button>
    <button role="tab" data-tab="b" aria-selected="false">इमेज से वीडियो</button>
    <button role="tab" data-tab="c" aria-selected="false">फ़ोटो + प्रॉम्प्ट से वीडियो</button>
  </div>

  <!-- A: text -> image -->
  <section class="panel" id="panel-a">
    <p class="lead">जो इमेज चाहिए, उसका वर्णन लिखें। अंग्रेज़ी में लिखने पर नतीजे अक्सर बेहतर आते हैं।</p>
    <textarea id="aPrompt" placeholder="जैसे: a red kite flying over a calm lake at sunrise"></textarea>
    <button class="go" id="aGo">इमेज बनाएँ</button>
    <p class="status" id="aStatus" role="status" aria-live="polite"></p>
    <div class="out" id="aOut" hidden>
      <img id="aImg" alt="बनाई गई इमेज">
      <a id="aLink" target="_blank" rel="noopener">इमेज खोलें और सेव करें</a><br>
      <button class="alt" id="aToVideo">इस इमेज से वीडियो बनाएँ</button>
    </div>
  </section>

  <!-- B: image -> video -->
  <section class="panel" id="panel-b" hidden>
    <p class="lead">फ़ोटो चुनें। AI अपने आप हलचल चुनकर उसे वीडियो बना देगा।</p>
    <label class="pick"><span id="bHint">फ़ोटो चुनने के लिए यहाँ छुएँ</span>
      <img id="bPrev" alt="चुनी हुई फ़ोटो" hidden>
      <input type="file" id="bFile" accept="image/png,image/jpeg,image/webp">
    </label>
    <button class="go" id="bGo">वीडियो बनाएँ</button>
    <p class="status" id="bStatus" role="status" aria-live="polite"></p>
    <div class="out" id="bOut" hidden>
      <video id="bVideo" controls loop playsinline></video>
      <a id="bLink" target="_blank" rel="noopener">वीडियो खोलें और सेव करें</a>
    </div>
  </section>

  <!-- C: photo + prompt -> video -->
  <section class="panel" id="panel-c" hidden>
    <p class="lead">फ़ोटो चुनें और लिखें कि उसमें क्या होना चाहिए।</p>
    <label class="pick"><span id="cHint">फ़ोटो चुनने के लिए यहाँ छुएँ</span>
      <img id="cPrev" alt="चुनी हुई फ़ोटो" hidden>
      <input type="file" id="cFile" accept="image/png,image/jpeg,image/webp">
    </label>
    <textarea id="cPrompt" placeholder="जैसे: the girl smiles and her hair moves in the wind, slow camera zoom"></textarea>
    <button class="go" id="cGo">वीडियो बनाएँ</button>
    <p class="status" id="cStatus" role="status" aria-live="polite"></p>
    <div class="out" id="cOut" hidden>
      <video id="cVideo" controls loop playsinline></video>
      <a id="cLink" target="_blank" rel="noopener">वीडियो खोलें और सेव करें</a>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((done) => setTimeout(done, ms));
let password = "";
let generatedUrl = null;
const sources = { b: null, c: null };

const say = (el, msg, isErr = false) => {
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
};

function show(tab) {
  for (const t of document.querySelectorAll("[role=tab]")) {
    t.setAttribute("aria-selected", String(t.dataset.tab === tab));
  }
  for (const p of document.querySelectorAll(".panel")) p.hidden = p.id !== "panel-" + tab;
}
for (const t of document.querySelectorAll("[role=tab]")) t.onclick = () => show(t.dataset.tab);
$("pw").oninput = (e) => (password = e.target.value);

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "x-app-password": password },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) {
    $("pwBox").hidden = false;
    throw new Error("पासवर्ड डालें और फिर से कोशिश करें।");
  }
  if (!r.ok) throw new Error(data.error || "गड़बड़ी हुई");
  return data;
}

// Start a job, then check every 3 seconds until it finishes.
async function run(startPath, body, statusEl, maxSeconds) {
  say(statusEl, "शुरू कर रहे हैं…");
  const { id } = await api(startPath, body);
  const started = Date.now();
  while (Date.now() - started < maxSeconds * 1000) {
    await wait(3000);
    const s = await api(`/api/status/${id}`);
    if (s.status === "succeeded" && s.url) return s.url;
    if (s.status === "failed" || s.status === "canceled") throw new Error(s.error || "बनाना नाकाम रहा");
    say(statusEl, `बन रहा है… ${Math.round((Date.now() - started) / 1000)} सेकंड हुए`);
  }
  throw new Error("बहुत देर लग गई। थोड़ी देर बाद फिर कोशिश करें।");
}

async function guard(button, statusEl, job) {
  button.disabled = true;
  try {
    await job();
  } catch (e) {
    say(statusEl, "गड़बड़ी: " + e.message, true);
  } finally {
    button.disabled = false;
  }
}

// Shrink big phone photos before upload (max 1280 px).
function toDataUri(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.9));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// A: text -> image
$("aGo").onclick = () =>
  guard($("aGo"), $("aStatus"), async () => {
    const prompt = $("aPrompt").value.trim();
    if (!prompt) throw new Error("पहले प्रॉम्प्ट लिखें।");
    $("aOut").hidden = true;
    const url = await run("/api/text-to-image", { prompt }, $("aStatus"), 120);
    generatedUrl = url;
    $("aImg").src = url;
    $("aLink").href = url;
    $("aOut").hidden = false;
    say($("aStatus"), "इमेज तैयार है।");
  });

$("aToVideo").onclick = () => {
  sources.c = { imageUrl: generatedUrl };
  $("cPrev").src = generatedUrl;
  $("cPrev").hidden = false;
  $("cHint").hidden = true;
  show("c");
};

// B and C: image (+ prompt) -> video
function wireVideo(p, needPrompt) {
  $(p + "File").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const uri = await toDataUri(file);
      sources[p] = { image: uri };
      $(p + "Prev").src = uri;
      $(p + "Prev").hidden = false;
      $(p + "Hint").hidden = true;
      say($(p + "Status"), "");
    } catch {
      say($(p + "Status"), "यह फ़ाइल इमेज नहीं लग रही। JPG या PNG चुनें।", true);
    }
  };
  $(p + "Go").onclick = () =>
    guard($(p + "Go"), $(p + "Status"), async () => {
      if (!sources[p]) throw new Error("पहले फ़ोटो चुनें।");
      const prompt = needPrompt ? $(p + "Prompt").value.trim() : "";
      if (needPrompt && !prompt) throw new Error("पहले प्रॉम्प्ट लिखें।");
      $(p + "Out").hidden = true;
      const url = await run("/api/image-to-video", { ...sources[p], prompt }, $(p + "Status"), 300);
      $(p + "Video").src = url;
      $(p + "Link").href = url;
      $(p + "Out").hidden = false;
      $(p + "Video").play().catch(() => {});
      say($(p + "Status"), "वीडियो तैयार है।");
    });
}
wireVideo("b", false);
wireVideo("c", true);
</script>
</body>
</html>
